services:
  postgres:
    image: postgres:16-alpine
    container_name: sharedbuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharedbuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharedbuy_password}
      POSTGRES_DB: ${POSTGRES_DB:-sharedbuy}
    ports:
      - "5434:5432"
    volumes:
      - sharedbuy_pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharedbuy} -d ${POSTGRES_DB:-sharedbuy}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sharedbuy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-sharedbuy}:${POSTGRES_PASSWORD:-sharedbuy_password}@postgres:5432/${POSTGRES_DB:-sharedbuy}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-sharedbuy-development-secret-key-very-secure-2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-SharedBuy}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - sharedbuy_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sharedbuy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sharedbuy_pgdata:
  sharedbuy_uploads:
